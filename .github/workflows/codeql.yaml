name: CodeQL

# C/C++ 静态分析,排除 third-party/ vendored 代码去噪。
# meson 项目 autobuild 不可靠,显式 meson 构建供注入(eigen5 为 in-repo
# vendored,无需 submodule)。
# 跑 arm64 裸 VM(ubuntu-24.04-arm):本项目全线 arm64-only(尤其 Kunpeng),
# SVE 等 aarch64 专属测试直接进分析库。
#
# 2026-09-29 根因勘定:此前 62% 失败并非"平台回收机群"——是 CodeQL 跟踪
# 构建下重模板 eigen TU 并发内存峰值耗尽 runner 内存(16GB RAM + 3GB
# swap,CODEQL_RAM=14535)。取证 run 36529815144(-j4 带内存探针):eigen
# 区 80 秒内 used 4→15.7GB、swap 填满 88%,runner 服务被杀("received a
# shutdown signal",exit 143);13/13 历史失败同死点(eigen_svd_jacobi /
# eigen_gemm 簇)。同款 runner 无 CodeQL 的 multi-os-verify 编译同一批
# TU 每 job 仅 ~3% 失败;x86 机群(同 16GB)历史同样死法——变量是提取器
# 内存叠加,与机群/架构无关。对策:ninja -j2(实测峰值降至 5.1GB、
# 余量 9.4GB、Build 7m10s,见 run 36530572140)。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 1'   # 每周一 UTC 02:37 = 北京 10:37

# 合并批次曾 3 分钟连发 7 个 run;同 ref 只留最新,PR 推新时取消旧 run 省配额
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (cpp)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60    # -j2 构建变慢,预期总时长 ~20min,留 3 倍余量
    permissions:
      security-events: write    # 上传 SARIF 到 Security and quality 页
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: cpp
          config: |
            paths-ignore:
              - third-party
              - bats
              - scripts
            query-filters:
              # SDC 测试故意压测弱加密算法(3DES/DOCSIS、MD5 等)以检测
              # 静默数据损坏——弱算法使用是测试本体而非生产缺陷, 排除
              # weak-cryptographic-algorithm 规则去噪(否则 ipsec_3des_docsis_*
              # 一族 7 个用例被标记为 high, 阻塞 merge)。
              - exclude:
                  id: cpp/weak-cryptographic-algorithm
      - name: Install build deps
        run: |
          sudo apt-get -y update -qq
          sudo apt-get -y install -qq meson ninja-build libboost-dev libeigen3-dev \
            libgtest-dev libhwloc-dev libssl-dev libzstd-dev zlib1g-dev
      - name: Build (meson, for CodeQL injection)
        run: |
          # 内存遥测:free 5s 采样随步骤日志实时上云。本 job 内存敏感(见
          # 文件头根因勘定),保留采样让任何未来内存回退在日志里直接可见、
          # runner 被杀也有死前现场——36529815144 的死亡曲线正是它拍的。
          # (dmesg --follow 探针已删:托管 runner 上实测零输出。)
          ( while sleep 5; do free -m | sed "s/^/[$(date +%T)] /"; done ) &
          FREE_PID=$!
          # bash -e 下 ninja 失败时脚本立即中止,后置 kill 行不可达 → watcher
          # 持有 stdout 管道写端,actions/runner 要等全部输出 FD 关闭才终结
          # 步骤(actions/runner#2415)——编译错误的 PR 会把 Build 挂到
          # 60min 超时而非快速失败。EXIT trap 在 -e 中止时同样执行,
          # 成功/失败两路都回收 watcher,且不改写退出码。
          trap 'kill $FREE_PID 2>/dev/null || true' EXIT
          # eigen 一律用 vendored eigen5(aarch64: GCC12+ 下系统 3.3.x 断;
          # x86: meson 走 pkg-config 找 eigen3)。必须用 $PWD 绝对路径:
          # ninja -C builddir 时编译器 cwd 是 builddir,相对 -I 解析到
          # builddir/third-party/eigen5 → "Eigen/Core: No such file"。
          # 其余 vendored 依赖缺席时 meson 优雅降级,足够静态分析覆盖面。
          # plain = 无优化无调试信息:静态分析只看编译器调用,不需要 -O3/-g。
          PKG_CONFIG_PATH="$PWD/third-party/eigen5" meson setup builddir --buildtype=plain
          # -j2:j4 时 4 条重模板 eigen 边(编译器+CodeQL 提取器)并发峰值
          # 实测 80s 内冲满 16GB RAM + 3GB swap(run 36529815144 取证),
          # runner 服务被杀。-j2 后实测峰值 5.1GB(run 36530572140)。
          # 构建时长未受损:同 run 实测 7m10s;ARM 机群性能方差 ~2x,
          # 另一样本 Build 14.9min(36531963900),总时长 ~21min。
          ninja -C builddir -j2
      - uses: github/codeql-action/analyze@v4
