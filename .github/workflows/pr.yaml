name: Pull Request

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# 推新 commit 取消同 PR 旧 run(本 workflow 仅 pull_request 触发,synchronize 必为新 push)
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout target branch (${{ github.base_ref }})
      uses: actions/checkout@v7
      with:
        ref: ${{ github.base_ref }}
        persist-credentials: false
    - name: Checkout PR
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check if the PR adds tabs in source files
      run: .github/scripts/check-no-tabs.sh origin/${{ github.base_ref }} HEAD
    - name: Check randomization of new test code
      run: python3 scripts/gha/check-randomization.py origin/${{ github.base_ref }} HEAD
    - name: Run codespell
      run: |
        pipx install codespell
        codespell
    - name: Install actionlint
      run: |
        # 官方脚本装到 $(pwd);先落盘再执行,否则 bash <(curl ...) 会吞掉
        # curl 的退出码(404 也显示绿),下一步才以 127 挂掉
        curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o /tmp/install-actionlint.sh
        bash /tmp/install-actionlint.sh
    - name: Run actionlint
      # 目录不能作参数(actionlint 当文件读 → "is a directory" exit 3);
      # 无参数 = 自动收集仓库全部 workflows,本地复合 action 经 uses 引用时校验
      run: ./actionlint -shellcheck= -pyflakes=

  git-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout the PR merge point
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Run the git checks
      run: .github/scripts/check-git-history.sh ${{ github.base_ref }} ${GITHUB_SHA}

  build-cpu:
    name: Build binary for CPU (Linux)
    needs: [ lint, git-sanity ]
    runs-on: ubuntu-24.04${{ matrix.archsuffix }}
    timeout-minutes: 45          # 实测 ~4min(arm64 4 核,apt+构建+unittests+selftests+quick),宽放
    container: debian:sid
    strategy:
      matrix:
        include:
        # arm64-only 项目:x86/Windows/GPU/IDXD 目标构建已移除(2026-09-25 决定),
        # unittests 覆盖随 x86 项删除移到本项。
        - { name: GCC-arm64, archsuffix: "-arm", env: "", meson_args: "", unittests: "unittests", selftests: "selftests" }
    steps:
      - name: Checkout the PR merge point
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build for CPU (Linux)
        uses: ./.github/actions/build-cpu
        with:
            name: ${{ matrix.name }}
            env: ${{ matrix.env }}
            meson_args: ${{ matrix.meson_args }}
            unittests: ${{ matrix.unittests }}
      - name: run unittests
        if: ${{ matrix.unittests }}
        shell: bash
        run: |
          ./builddir/unittests \
            --gtest_filter=-LinuxThermalFixture.CurrentMachine_TestUsingSingletomTemperaturesOnCurrentMachine # this test doesn't execute properly in a github runner
      - name: verify selftests
        shell: bash
        run: |
          set -x
          set selftest_skip \
              $(builddir/sdcshield --selftests --list-tests | grep selftest_log_skip) \
              '@positive'
          for t; do
            builddir/sdcshield --quick --selftests -e "$t" -o -
          done
          set selftest_failinit selftest_logerror
          for t; do
            if builddir/sdcshield --quick --retest-on-failure=0 --selftests -e "$t" -o -; then
              exit 1
            else
              [[ $? = 1 ]]
            fi
          done
      - name: run selftests
        if: ${{ matrix.selftests }}
        shell: bash
        run: |
          ulimit -St 120
          SANDSTONE_BIN=builddir/sdcshield bats -t bats/sanity-check
      - name: run tests quickly
        shell: bash
        run: |
          ulimit -St 120
          nproc=`nproc`
          nproc=$((nproc > 4 ? 4 : nproc))
          # 落盘 allquality 型日志(-o 指定的文件全过也保留);
          # 供下方 report-summary.py 出「用例 × 结果[耗时]」矩阵。
          # 云 runner 禁用集与 nightly(verify-params.py)一致:eigen 数值类
          # (ULP flakiness,nightly 以 -n 1 专项覆盖)+ mesh_upi*/memcpy_rewr
          # (需多 NUMA 真实硅);random_access_sweep 在 debian:sid 容器静默
          # abort(issue #183)暂一并禁用。
          builddir/sdcshield --quick -n$nproc --retest-on-failure=0 \
            --disable eigen_svd_double --disable eigen_sparse \
            --disable eigen_svd_cdouble --disable eigen_svd_cdouble_sve \
            --disable 'mesh_upi*' --disable memcpy_rewr \
            --disable random_access_sweep \
            -o quick.yaml
      # quick 结果矩阵进 PR 页 step summary(复用 nightly 的 report-summary.py;
      # 目录名 verify-<matrix.name> 对齐其 all-results/verify-*/results/allquality.yaml
      # glob,零脚本改动;失败时 -o 文件同样保留,失败现场也出矩阵)。
      - name: test-result matrix summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f quick.yaml ]; then
            mkdir -p "all-results/verify-${{ matrix.name }}/results"
            cp quick.yaml "all-results/verify-${{ matrix.name }}/results/allquality.yaml"
            python3 scripts/gha/report-summary.py >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: upload test run logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-linux-${{ matrix.name }}-logs
          if-no-files-found: ignore
          path: |
            *.yaml
          retention-days: 3

  # multi-version:在 openEuler 多版本容器里构建+纯净验证,作 polyfill/sed 适配层的
  # 回归哨兵。PR 跑"角落三"(最老 toolchain + 基准),覆盖适配层被源码改动带歪的情况。
  # 全 15 SP 的 full 验证留给 nightly/release(另 workflow)。
  multi-version:
    name: Multi-version (${{ matrix.series }}-${{ matrix.sp }})
    needs: [ lint, git-sanity ]
    runs-on: ubuntu-24.04-arm   # GitHub hosted arm64;换 self-hosted 见注释
    timeout-minutes: 90         # 实测 ~7-8min(镜像烘焙+构建+smoke),宽放
    strategy:
      fail-fast: false
      matrix:
        include:
        - { series: "20.03", sp: "LTS" }   # 最老 toolchain(gcc-7+toolset-10),适配层哨兵
        - { series: "22.03", sp: "SP3" }
        - { series: "24.03", sp: "SP3" }   # 基准版本
    steps:
      - name: Checkout PR + submodules(RPM 树)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo
      - name: Build image + source + smoke-verify (corner three)
        run: |
          # build-all.sh:镜像就绪(幂等)→ 源码构建(杠杆1)→ 打包 → verify-pristine smoke
          # 在 hosted runner 上首次会从 quay 拉 base + 烘焙 deps(~数分钟)。
          # 换 self-hosted runner + ghcr.io 预构建镜像可跳过烘焙,详见 docs/multi-version-build-deploy.md §6。
          ./scripts/offline-build/build-all.sh ${{ matrix.series }} ${{ matrix.sp }} --smoke
      - name: Show result
        if: ${{ always() }}
        run: |
          cat "third-party/rpms/openEuler-${{ matrix.series }}/openEuler-${{ matrix.series }}$(case ${{ matrix.sp }} in LTS) echo LTS;; SP*) echo LTS_${{ matrix.sp }};; esac)/built/VERSION" 2>/dev/null || true
