name: Security

# CI 流水线自身与依赖面的安全扫描(zizmor / gitleaks / osv-scanner)。
# PR 即时反馈 + 每周一全量(cron 避整点错峰)。

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 3 * * 1'   # 每周一 UTC 03:23 = 北京 11:23

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # zizmor-action 内置 SARIF 上传步骤(codeql-action upload-sarif):
      # 缺 security-events: write 时审计本身过码 0,上传 403 连坐整个 job
      contents: read
      security-events: write
      # 2026-09-29 07:08-07:43 起,action 内部 GET /actions/workflow-runs/{id}
      # (遥测+SARIF 指纹路径)被严格执行 actions: read,缺它 403 连坐整个
      # job(与 gitleaks 同窗口翻转,见 gitleaks job 注释)
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run zizmor
        # 上游全程 0.x 系列无 v1 tag(写 v1 会 action 解析失败),须 pin 具体版本
        uses: zizmorcore/zizmor-action@v0.7.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    name: gitleaks (credential leaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # gitleaks-action 在每个 pull_request 事件都先 GET /pulls/N/commits
      # 枚举扫描范围(x-accepted-github-permissions: pull_requests=read),
      # 发现泄漏时还要 createReviewComment 标注位置。workflow 级只有
      # contents: read → 2026-09-29 08:15 起(07:43 的 PR#210 仍绿,08:15
      # 的 PR#211 起红,期间本文件与 action 版本零变化)该调用 403
      # "Resource not accessible by integration" 连坐整个 job——与 zizmor
      # 2026-09-25 的 security-events 教训同类。write 而非 read:真泄漏时
      # 评论失败会以同样的 403 崩溃,与"发现泄漏"的红混为一谈不可诊断。
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 全历史:本仓 fork 自 OpenDCDiag,历史长
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    name: osv-scanner (vendored CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      # 上游只有 v2.x.y tag,无裸 v2 tag/分支(写 v2 会 action 解析失败)。
      # v2 CLI 是 scan source 子命令:--skip-git 已不存在("flag provided
      # but not defined");本仓无 lockfile,空扫描用 --allow-no-lockfiles 通过
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            -r
            --allow-no-lockfiles
            ./

