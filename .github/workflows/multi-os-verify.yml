name: Multi-OS Verify

# 多 openEuler 版本(20.03 / 22.03 / 24.03 × LTS+SP1~SP4 = 15)每日全量功能验证 + 跨 OS 基准。
#
# 原生容器执行模式:作业直接 `container:` 运行在目标 ghcr.io 构建镜像里(代码由
# actions/checkout 自动挂载到容器工作目录),配置最简洁、无 docker 嵌套、无 SELinux :Z 竞态。
#
# 触发:每天 12:00(北京时间 UTC+8)的 cron + 手动 workflow_dispatch。
#   注意 GitHub cron 按 UTC 解释:"0 4 * * *" = UTC 04:00 = 北京时间 12:00。
#   cron 只对默认分支生效;其它分支用 workflow_dispatch(可选 verify_depth 参数)。

on:
  schedule:
    - cron: '0 4 * * *'          # 每天 UTC 04:00 = 北京时间 12:00
  workflow_dispatch:
    inputs:
      verify_depth:
        description: '验证深度(full = 全量+参数扫描 / smoke = 快档:list-tests + zstd19)'
        required: false
        default: 'full'
        type: choice
        options: [full, smoke]
      publish_release:
        description: '把本次 15 个 built/ tarball 发布为 GitHub Release(永久保存;默认否,artifact 90 天滚动)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read                # 顶层最小化;写权限只给真正需要的 job(release)
  packages: read                # verify job 拉 ghcr 镜像仍需

# 并行度上限:GHA 免费版同仓并发 20 job,15 个镜像 job + 1 个 report 无压力;
# 若换 self-hosted 小机器可调低(见 docs/multi-version-build-deploy.md GHA 章节)。
concurrency:
  group: multi-os-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false       # 日报不互相取消

jobs:
  verify:
    name: verify (${{ matrix.series }}-${{ matrix.sp }})
    # GitHub hosted aarch64 运行器(原生支持 container: 属性,需 arm64 镜像)。
    # 如需在自建 kunpeng920 runner 上跑,改成 labels: [self-hosted, linux, arm64]。
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/wangxumarshall/sdcshield-offline:${{ matrix.series }}-${{ matrix.sp }}
      # 私有镜像在 user 命名空间 ghcr.io,wangxumarshall/sdcshield-offline,GITHUB_TOKEN
      # (repo-scoped)拉不动。用 GHCR_TOKEN(repo secret,classic PAT 带 read:packages)
      # 认证。username 固定 wangxumarshall(github.actor 在 schedule 下为空会致 login 失败)。
      credentials:
        username: wangxumarshall
        password: ${{ secrets.GHCR_TOKEN }}
      options: --user root        # 镜像内源码构建/装包需 root
    strategy:
      fail-fast: false            # 15 个镜像互不拖累,全跑完再出结论
      matrix:
        include:
          # 三系列 × LTS+SP1~SP4 = 15。sp 用完整后缀(与 ghcr 镜像 tag 严格一致:24.03-LTS-SP3);
          # series 决定 toolchain/宏/polyfill 分支(构建只在同一 series 内一致)。
          - { series: '20.03', sp: 'LTS' }
          - { series: '20.03', sp: 'LTS-SP1' }
          - { series: '20.03', sp: 'LTS-SP2' }
          - { series: '20.03', sp: 'LTS-SP3' }
          - { series: '20.03', sp: 'LTS-SP4' }
          - { series: '22.03', sp: 'LTS' }
          - { series: '22.03', sp: 'LTS-SP1' }
          - { series: '22.03', sp: 'LTS-SP2' }
          - { series: '22.03', sp: 'LTS-SP3' }
          - { series: '22.03', sp: 'LTS-SP4' }
          - { series: '24.03', sp: 'LTS' }
          - { series: '24.03', sp: 'LTS-SP1' }
          - { series: '24.03', sp: 'LTS-SP2' }
          - { series: '24.03', sp: 'LTS-SP3' }
          - { series: '24.03', sp: 'LTS-SP4' }
    env:
      SERIES: ${{ matrix.series }}
      SP: ${{ matrix.sp }}
    # 全量+参数扫描实测(本机 canary)单作业可达 ~30 min;镜像+构建另计。留足余量。
    timeout-minutes: 120
    steps:
      # 原生容器模式:checkout 即把源码克隆进容器工作目录(容器内已预置 git)。
      # 子模块(rpms)不 checkout —— 构建镜像已烘焙全部依赖 + 20.03 工具集。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false

      # ---- 源码构建(镜像内已装全部依赖,直接 meson+ninja) ----
      # 不用 actions/cache 缓存 vendored install/:它是 glibc 耦合产物(20.03/22.03/24.03
      # 各不同),且 openblas 的 install/lib/libopenblas.a 是符号链接 → tar 缓存不保留
      # 符号链接,恢复后变 dangling symlink,`[ -f ]` 判 false 触发重建、又撞上被缓存
      # 带进来的残留解包目录 → 秒败。正确性 > 提速(每日 cron 场景,多花 ~25min 换确定性)。
      # 镜像已烘焙 300+ RPM 依赖,构建只做 vendored 编译 + meson + ninja。
      # 22.03/20.03 注入 -DOPENEULER_22_03 / _20_03 + cpp23 polyfill + cpp_std=gnu++20;
      # 20.03 用仓内 vendored meson 0.59.4(python3.7 可跑,系统无 meson)。
      - name: Build (vendored libs + meson + ninja)
        shell: bash
        run: |
          set -uo pipefail
          export JOBS="$(nproc)"
          case "$SERIES" in
            24.03) CPPSTD="gnu++23"; OEU_MACRO=""; MESON_CMD="meson" ;;
            22.03) CPPSTD="gnu++20"; OEU_MACRO="OPENEULER_22_03"; MESON_CMD="meson" ;;
            20.03) CPPSTD="gnu++20"; OEU_MACRO="OPENEULER_20_03"; MESON_CMD="python3 third-party/meson/meson-0.59.4/meson.py" ;;
          esac
          # 20.03 默认 gcc 是 7.3(无 C++20),必须激活镜像烘焙的 gcc-toolset-10
          # (在 /opt/openEuler/gcc-toolset-10/root/,含 gcc-10 + 其 libstdc++)。对齐
          # container-build.sh 的 toolset 激活块: PATH/CC/CXX/LDFLAGS(rpath)/PKG_CONFIG_PATH。
          # 22.03(gcc-10.3.1 默认)/24.03(gcc-12)无此目录 → 自然跳过。
          TOOLSET_ROOT="/opt/openEuler/gcc-toolset-10/root"
          if [ -d "$TOOLSET_ROOT/usr/bin" ]; then
            export PATH="$TOOLSET_ROOT/usr/bin:$PATH"
            export CC="$TOOLSET_ROOT/usr/bin/gcc"
            export CXX="$TOOLSET_ROOT/usr/bin/g++"
            export LDFLAGS="-L$TOOLSET_ROOT/usr/lib64 -Wl,-rpath,$TOOLSET_ROOT/usr/lib64 ${LDFLAGS:-}"
            export PKG_CONFIG_PATH="$TOOLSET_ROOT/usr/lib64/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "activated gcc-toolset-10: $(gcc --version 2>/dev/null | head -1)"
          fi
          echo "::group::vendored libraries"
          # 20.03-LTS 最小镜像只有 bsdtar(无 GNU tar);vendored 的 build.sh 硬编码 tar。
          # 这里 tar 缺 -> ln -s bsdtar 兜底(bsdtar 兼容 xzf --strip-components)。align
          # container-build.sh 的 TAR_BIN 兜底思路。
          if ! command -v tar >/dev/null 2>&1 && command -v bsdtar >/dev/null 2>&1; then
            mkdir -p /usr/local/bin
            ln -sf "$(command -v bsdtar)" /usr/local/bin/tar
            echo "shim tar -> bsdtar (20.03 最小镜像无 GNU tar)"
          fi
          # sleef 需 cmake:24.03 镜像 cmake 断链(缺 libuv.so.1)、22.03/20.03 无 cmake → 优雅缺席
          # (与 container-build.sh 一致)。openssl/openblas/isa-l 均 make 路径,镜像内可重建。
          for lib in openssl openblas isa-l; do
            ( cd "third-party/$lib" && bash build.sh ) || { echo "::error::$lib build failed"; exit 1; }
          done
          echo "::endgroup::"
          export CXXFLAGS="${CXXFLAGS:-}"
          if [ -n "$OEU_MACRO" ]; then
            export CXXFLAGS="-D${OEU_MACRO} -include $(pwd)/framework/compat/cpp23_polyfill.h -include unistd.h -isystem $(pwd)/framework/compat ${CXXFLAGS}"
          fi
          ACL_OPT=""; [ -n "$OEU_MACRO" ] && ACL_OPT="-Denable_acl=disabled"
          echo "::group::meson setup ($CPPSTD $ACL_OPT)"
          # eigen5 前置(pkg-config 兼容保留),toolset pkgconfig(20.03)已在 PKG_CONFIG_PATH 里
          PKG_CONFIG_PATH="$(pwd)/third-party/eigen5:${PKG_CONFIG_PATH:-}" $MESON_CMD setup builddir --buildtype=release \
            -Dcpp_std="$CPPSTD" $ACL_OPT
          echo "::endgroup::"
          echo "::group::ninja"
          ninja -C builddir
          echo "::endgroup::"
          echo "::group::self-check"
          N="$(builddir/sdcshield --list-tests 2>/dev/null | wc -l)"
          echo "list-tests: $N"
          [ "$N" -gt 100 ] || { echo "::error::too few tests ($N)"; exit 1; }
          builddir/sdcshield --dump-cpu-info | head -1
          echo "::endgroup::"

      # ---- 打包自包含 built/(bin+libs+脚本+元数据),与本地 podman 链路的
      # third-party/rpms/.../built/ 结构一致。脚本见 scripts/gha/package-built.sh;
      # 原生容器模式 ldd/strip 直跑(15 镜像实测全有),20.03-LTS 的 tar 用
      # bsdtar 兜底(脚本内置)。BUILD-HASH 公式与 build-all.sh 对齐,同 commit
      # 时与本地 built/ 相等 —— 两条链路等价的机器可查锚点。----
      - name: Package built/ (self-contained tarball)
        shell: bash
        run: |
          set -uo pipefail
          # SP 归一化:矩阵值是完整形式(LTS-SP3),case 认裸形式(SP3)/LTS 本体。
          # 与 package-built.sh 的归一化同语义(非 LTS 时剥 LTS- 前缀)。
          [ "$SP" != "LTS" ] && SP="${SP#LTS-}"
          OS_TAG="openEuler-${SERIES}$(case "$SP" in LTS) echo LTS;; SP*) echo LTS_$SP;; esac)"
          # 自诊断:失败时日志里直接有环境现场(uid/工具/目录),不再盲猜
          echo "pkg-debug: uid=$(id -u) tar=$(command -v tar || echo MISSING) bsdtar=$(command -v bsdtar || echo MISSING) strip=$(command -v strip || echo MISSING) ldd=$(command -v ldd || echo MISSING) git=$(command -v git || echo MISSING) readlink=$(command -v readlink || echo MISSING)"
          echo "pkg-debug: builddir/sdcshield: $(ls -la builddir/sdcshield 2>&1)"
          bash -x scripts/gha/package-built.sh builddir "dist/$OS_TAG" "$SERIES" "$SP" 2>&1 | tee /tmp/pkg-trace.log
          rc=${PIPESTATUS[0]}
          echo "pkg-debug: exit=$rc; dist 树:"
          find dist -maxdepth 3 2>/dev/null || true
          exit $rc

      # ---- 产物闸门:解开刚打的 tarball,只设 LD_LIBRARY_PATH=libs 运行
      # (容器内形态的 verify-built-pristine.sh smoke)。失败即红 ——
      # 打出来的包必须真能跑,不静默降级。----
      - name: Package smoke-verify (pristine, libs/ only)
        shell: bash
        run: |
          set -uo pipefail
          # SP 归一化:矩阵值是完整形式(LTS-SP3),case 认裸形式(SP3)/LTS 本体。
          # 与 package-built.sh 的归一化同语义(非 LTS 时剥 LTS- 前缀)。
          [ "$SP" != "LTS" ] && SP="${SP#LTS-}"
          OS_TAG="openEuler-${SERIES}$(case "$SP" in LTS) echo LTS;; SP*) echo LTS_$SP;; esac)"
          TARBALL=$(ls dist/$OS_TAG/sdcshield-$OS_TAG-*.tar.gz 2>/dev/null | sed -n 1p)
          [ -n "$TARBALL" ] || { echo "::error::no tarball in dist/$OS_TAG (package step output above)"; exit 1; }
          rm -rf /tmp/pristine && mkdir -p /tmp/pristine
          tar -xzf "$TARBALL" -C /tmp/pristine 2>/dev/null || bsdtar -xzf "$TARBALL" -C /tmp/pristine
          PKG="/tmp/pristine/$OS_TAG"
          export LD_LIBRARY_PATH="$PKG/libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          N="$($PKG/sdcshield --list-tests 2>/dev/null | wc -l)"
          echo "pristine list-tests: $N"
          [ "$N" -gt 100 ] || { echo "::error::pristine too few tests ($N)"; exit 1; }
          out=$($PKG/sdcshield -e zstd19 -t 2000 -n 1 2>&1 | grep -iE 'exit:' | tail -1 || echo "exit: unknown")
          echo "pristine zstd19: $out"
          echo "$out" | grep -qi 'exit: pass'

      # ---- 全量参数功能验证(脚本见 scripts/gha/verify-params.py) ----
      # 注意: shell: bash 展开为 bash -e -o pipefail, 失败行会即刻终止 step,
      # 后续 rc=$?/tail 根本到不了(run 38242267210 的 4 个 verify job 因此
      # 在 CI 日志里零诊断输出); 必须 || rc=$? 接住退出码再打摘要。
      - name: Verify (full parameter sweep)
        if: ${{ inputs.verify_depth != 'smoke' }}
        shell: bash
        run: |
          mkdir -p results
          rc=0
          python3 -u scripts/gha/verify-params.py --bin "$(pwd)/builddir/sdcshield" --out "$(pwd)/results" \
            > verify.log 2>&1 || rc=$?
          tail -40 verify.log
          exit $rc

      # ---- 快档验证(workflow_dispatch 选 smoke 时) ----
      - name: Verify (smoke)
        if: ${{ inputs.verify_depth == 'smoke' }}
        shell: bash
        run: |
          mkdir -p results
          rc=0
          python3 -u scripts/gha/verify-params.py --bin "$(pwd)/builddir/sdcshield" --out "$(pwd)/results" --smoke \
            > verify.log 2>&1 || rc=$?
          tail -40 verify.log
          exit $rc

      # ---- 跨 OS 基准(固定 loop 数,同工作量墙钟对比) ----
      # 同上: bash -e 下 cat benchmark.log 需 || rc=$? 接住才能在失败时打出。
      - name: Benchmark (fixed loop count)
        shell: bash
        run: |
          mkdir -p benchmark
          rc=0
          bash scripts/gha/benchmark.sh "$(pwd)/builddir/sdcshield" "$(pwd)/benchmark" \
            > benchmark.log 2>&1 || rc=$?
          cat benchmark.log
          exit $rc

      # ---- 上传结果(成功与否都传,便于诊断) ----
      - name: Upload logs & benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.series }}-${{ matrix.sp }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            results/
            verify.log
            benchmark/benchmark.tsv
            benchmark.log
            builddir/sdcshield-*.yaml
            builddir/sdcshield-*.log

      # ---- 上传自包含 built/ tarball(每次 CI 一版,90 天保留)。
      # if: always() 保失败现场;if-no-files-found: error 让打包缺失显式红。----
      - name: Upload built/ tarball
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.series }}-${{ matrix.sp }}
          retention-days: 90
          if-no-files-found: error
          path: dist/*/sdcshield-*.tar.gz

  report:
    name: report
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read            # checkout 脚本
      actions: read             # gh 下载其它 run 的 artifact(耗时对比基线)需要
    steps:
      - name: Checkout (for scripts/gha/report-summary.py)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download all artifacts (keep per-image dirs)
        uses: actions/download-artifact@v8
        with:
          path: all-results
          pattern: verify-*
      # ---- 下载上次成功全量运行的 verify-* artifact 作为耗时对比基线。
      # 候选 = 本 workflow 最近 8 个 success run(databaseId 单调增,sort -rn 即新到旧,
      # 排除当前 run 自身);逐个试下,接受第一个目录树里含 allquality.yaml 的候选
      # (全量运行才有 allquality.yaml;smoke 运行只有 smoke_zstd19.yaml,天然被排除)。
      # run 已过 7 天 retention → gh run download 失败,清目录试下一个。
      # 全都没有 → 基线=none,后续步骤无 --previous 照常跑;任何失败只降级不红 job
      # (基线是增强信息,不是门槛)。----
      - name: Download previous full-run baseline (duration delta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rm -rf prev-all-results
          for id in $(gh run list --workflow multi-os-verify.yml --status success --limit 8 \
                      --json databaseId --jq '.[].databaseId' | sort -rn); do
            [ "$id" != "${{ github.run_id }}" ] || continue
            echo "trying baseline candidate run $id ..."
            if gh run download "$id" --pattern 'verify-*' --dir prev-all-results; then
              n=$(find prev-all-results -name allquality.yaml | wc -l)
              if [ "$n" -gt 0 ]; then
                echo "baseline: run $id ($n allquality.yaml)"
                exit 0
              fi
              echo "run $id has no allquality.yaml (smoke run?) — try older"
            fi
            rm -rf prev-all-results
          done
          echo "no baseline found — duration delta disabled for this run"
      # 不 merge:15 份 allquality.yaml 各占一名。汇总成「用例 × 版本」结果矩阵
      # (PASS[耗时]/FAIL[耗时]/SKIP[耗时]/TIMEOUT[耗时]/CRASH[耗时]/OSERR[耗时],空=无此用例;
      # 有基线时每格耗时附 (±Δs) = 相对上次成功全量运行的耗时变化,仅对比耗时)。
      # tee:矩阵同时进 job 日志(API 可取,summary 页面外的第二条取证渠道)。
      # set +e:汇总失败不红 job(report 是信息聚合,不是闸门)。----
      - name: Build full test-result matrix summary
        run: |
          set +e
          if find prev-all-results -name allquality.yaml 2>/dev/null | grep -q .; then
            python3 scripts/gha/report-summary.py --previous prev-all-results | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/gha/report-summary.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "report done"

  # ---- 基准趋势:只取 24.03-LTS-SP3(基准版本)的 benchmark.tsv 上 gh-pages。
  # 独立非容器 job(避免 container 内 git push 兼容问题);benchmark-action
  # auto-push 自动创建/更新 gh-pages 分支。共享 runner 噪声大,先观测告警
  # 不硬门(fail-on-alert: false),趋势稳定后再评估收紧。----
  benchmark-trend:
    name: benchmark trend (gh-pages)
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write            # auto-push 到 gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: verify-24.03-LTS-SP3
          path: bench
          merge-multiple: true
      - name: Convert to benchmark JSON
        run: |
          tsv=$(ls bench/benchmark/benchmark.tsv 2>/dev/null || ls bench/*/benchmark/benchmark.tsv 2>/dev/null | head -1)
          [ -n "$tsv" ] || { echo "no benchmark.tsv (unexpected) — skip trend update"; exit 0; }
          python3 scripts/gha/benchmark-to-json.py "$tsv" bench/benchmark.json
      - uses: benchmark-action/github-action-benchmark@v1
        with:
          name: sdcshield benchmark (24.03-LTS-SP3)
          tool: customSmallerIsBetter
          output-file-path: bench/benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

  # ---- Release 永久保存(人工选择):workflow_dispatch 勾选 publish_release 时,
  # 把本次 15 个 built/ tarball 从 artifact 下载后作为 Release 资产上传。
  # Release 资产永久保留(除非手动删),公开仓免费,单资产上限 2GB。
  # cron 触发时 inputs.publish_release 不存在 → 恒 false,行为不变。
  # 用法语义:里程碑式手动钉版(重要合入后);nightly 由 90 天滚动 artifact 承担。----
  release:
    name: release (permanent)
    needs: [verify, report]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write            # gh release create 需要;GitHub job 级权限覆盖顶层
    steps:
      - name: Download built/ tarballs
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: built-*
          merge-multiple: true     # 15 个 artifact 的 tar.gz 合并到 dist/ 平铺
      - name: Create release with 15 tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist/
          # tarball 在 dist/<OS_TAG>/ 子目录(upload-artifact 保留最小公共祖先
          # 下的目录层级,merge-multiple 只合并不平铺)— glob 深一层匹配
          TAG="build-$(date +%Y%m%d)-${GITHUB_SHA::8}"
          echo "release tag: $TAG"
          # --repo 显式指定:本 job 无 checkout 步骤,gh 无法从 .git 推断仓库
          # (run 35513299740 现场: fatal: not a git repository)
          gh release create "$TAG" dist/*/sdcshield-*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "sdcshield build $(date +%Y-%m-%d)" \
            --notes "Multi-OS Verify 构建产物(15 个 openEuler SP 自包含包)。
          源 commit: ${GITHUB_SHA}
          验证 run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          每个包含 stripped 二进制 + libs/ + run-sdcshield.sh + MANIFEST.tsv + VERSION + BUILD-HASH。
          保留策略:Release 资产永久;同源 artifact 另有 90 天滚动副本。"
          echo "==> release created: $TAG"
