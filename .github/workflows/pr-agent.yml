# .github/workflows/pr-agent.yml
# 提交 PR / 推送新 commit 后自动检视,并以 bot 身份回贴检视意见(公共仓库 Actions 分钟数免费)
name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

# 推新 commit 取消同 PR 旧 run
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    # fork PR 无法读取仓库 secret,自动跳过;本仓库分支 PR 正常检视
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 使用 Google AI Studio 免费额度,模型 ID 可按需替换
          CONFIG.MODEL: "gemini/gemini-3.8-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-2.5-flash"]'
          # GitHub Action 模式下自动执行的命令
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
