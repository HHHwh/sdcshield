# .github/workflows/pr-agent.yml
# 提交 PR / 推送新 commit 后自动检视,并以 bot 身份回贴检视意见(公共仓库 Actions 分钟数免费)
name: PR Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

# 推新 commit 取消同 PR 旧 run
concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    runs-on: ubuntu-latest
    # fork PR 无法读取仓库 secret,自动跳过;本仓库分支 PR 正常检视
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 使用 Google AI Studio 免费额度,模型 ID 可按需替换。
          # 回退链约束: 2.5 系列已对免费层新用户下线(404 "no longer available
          # to new users"),只能用对新项目开放的模型(3.8/3.6/3.5-flash-lite);
          # 3.1-flash-lite 将于 2027-05-07 关停,不用作回退。
          CONFIG.MODEL: "gemini/gemini-3.8-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.5-flash-lite", "gemini/gemini-3.6-flash"]'
          # GitHub Action 模式下自动执行的命令
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
