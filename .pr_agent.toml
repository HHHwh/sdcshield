# PR-Agent 仓库级配置（SDCShield）
# 说明：本文件用于让 PR 检视 bot 以中文输出，并聚焦本项目的核心目标——
# 对目标计算单元的「SDC（静默数据损坏）激发能力」以及正确性/架构守卫。
# 仅使用 PR-Agent 官方支持的真实配置键。

[config]
# 检视意见统一使用简体中文
response_language = "zh-CN"

[pr_reviewer]
# 要求 bot 在检视时同时审查测试相关代码
require_tests_review = true

# 本项目的专属检视要点（内嵌为 reviewer 的附加指令）
extra_instructions = """
本仓库为 SDCShield —— 一个通过向计算单元施加压力、并对结果做字节级 golden 比对，
来检测「静默数据损坏（SDC，即不崩溃但产生错误比特）」的诊断工具。
在审查本仓库的 Pull Request 时，请以「SDC 激发能力 + 正确性 + 架构守卫」为最高优先级，
逐条对照以下 8 项要点给出具体、可定位到文件/行的意见（论文依据编号 [NN] 对应
docs/paper/ref-paper-fullread-digest/NN-*.md）：

1. 激发强度与覆盖：改动是否真正压到目标计算单元（FMA / SIMD / 压缩 / SVD / crypto）？
   靶点优先 FMA/乘法器（现场向量 SDC >75% 来自 FMA [05]）；数据宽度是否覆盖目标位宽；
   TEST_LOOP 是否为定时持续压测而非固定迭代（存在 <10⁻⁵ 概率的激发窗口 [05]，短跑通过
   不证明无缺陷）；指令序列是否足够长且多样（截短至数十条时乘法器类故障检出崩塌至 0% [26]）。

2. 数据模式与缺陷激活：除随机/全 0/全 1/边界值/NaN/Inf/极值外，是否包含边际缺陷激活
   模式——长时间固定电平后再翻转（BTI；FPU 老化易感路径 1366 条 vs ALU 11 条 [28]）、
   位翻转敏感（SDF）模式？FP 测试是否覆盖有界值域与全域随机双档？FP64 是否注意指数/
   符号位敏感（现场可翻指数位、误差达 10⁴ 倍，「只伤尾数」假设不成立 [05]）？
   边际敏感测试是否标注频率/电压条件（无 cpufreq 平台检出打折 [31][32]）？

3. golden 比对：是否字节级 memcmp（memcmp_or_fail）？浮点是否可复现（SNaN/NaN 位型
   跨架构一致）？是否 per-lane 独立比对——98.5% 向量 SDC 仅影响单 lane [05]，禁止
   sum/xor/reduce 类跨 lane 聚合校验掩蔽单 lane 错误？任何容差/近似比较 = SDC 盲区，
   必须指出。

4. 正确性基线（x86-64 非回归）：ARM64 移植必须是加法式的（#elif __aarch64__ 或按架构
   meson 守卫）；是否存在不当扩大 #ifdef __x86_64__、改变 x86-64 既有行为的改动？

5. 诚实性：ARM64 未实现项必须 EXIT_SKIP 且先 log_skip，理由格式
   "to be implemented (placeholder): <缺失内容>"；严禁 no-op 测试假通过。

6. 架构相关缺陷：SVE/NEON 向量长度（VL）相关越界/误报；CI runner VL=128 会掩盖
   512-bit VL 缺陷；新指令代际效应——SVE2/FCMLA/FMMLA/谓词指令处首代部署期属最高
   风险窗口，优先保证覆盖密度 [02]。

7. 失败现场留存：冷路径 bit dump / sum-bit / failing-vector 记录，外加出错 lane 编号
   直方图（单 lane vs 多 lane、相邻 vs 跨 lane 是区分缺陷性质的一级证据 [05]）；
   随机输入必须全部经框架 RNG（受 -s seed 控制）以保证失败可重放，禁止直用
   std::random_device 等非受控熵源。

8. 多样性与检出率口径：新增测试须在「指令 × 数据模式 × 结构要素」至少一个维度上与
   既有测试不同（31% 现场故障测试是某机器唯一失败的测试 [02]）；对外引用的检出率
   数字必须标注口径（时长、线程数、频率/电压条件）——检出率是下界，全绿不等于无缺陷 [09]。

降噪约束（必须遵守）：
请聚焦于 SDC 激发能力、功能正确性与架构守卫。
不要输出纯粹的代码风格、命名、缩进、格式排版等与上述要点无关的意见，
避免产生噪音。若某处不涉及上述要点，直接略过即可。
"""
