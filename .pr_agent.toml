# PR-Agent 仓库级配置（SDCShield）
# 说明：本文件用于让 PR 检视 bot 以中文输出，并聚焦本项目的核心目标——
# 对目标计算单元的「SDC（静默数据损坏）激发能力」以及正确性/架构守卫。
# 仅使用 PR-Agent 官方支持的真实配置键。

[config]
# 检视意见统一使用简体中文
response_language = "zh-CN"

[pr_reviewer]
# 要求 bot 在检视时同时审查测试相关代码
require_tests_review = true

# 本项目的专属检视要点（内嵌为 reviewer 的附加指令）
extra_instructions = """
本仓库为 SDCShield —— 一个通过向计算单元施加压力、并对结果做字节级 golden 比对，
来检测「静默数据损坏（SDC，即不崩溃但产生错误比特）」的诊断工具。
在审查本仓库的 Pull Request 时，请以「SDC 激发能力 + 正确性 + 架构守卫」为最高优先级，
逐条对照以下要点给出具体、可定位到文件/行的意见：

1. 激发强度与覆盖：改动是否真正压到目标计算单元（FMA / SIMD / 压缩 / SVD / crypto）？
   是否覆盖了目标数据宽度与数据模式（含边界值、非规格化数、随机模式等）？
   `TEST_LOOP` 的定时压力是否充足、是否会给计算单元带来持续饱和负载？
   若压力不足或未命中目标单元，请明确指出并给出加强建议。

2. golden 比对：结果校验是否采用字节级 `memcmp`（memcmp_or_fail）？
   浮点结果是否保证可复现（SNaN/NaN 位型需跨架构一致，框架已在 sandstone_data.cpp 统一 quiet）？
   任何用容差比较、近似相等、只比部分字段而放松 golden 校验的改动都属于高风险，必须指出。

3. 正确性基线（x86-64 非回归）：本项目的 ARM64 移植必须是「加法式」的——
   新增代码应通过 `#elif __aarch64__` 或按架构的 meson 守卫隔离；
   是否存在把 `#ifdef __x86_64__` 不当扩大、从而改变 x86-64 既有行为的改动？
   x86-64 是未改动的参考实现，任何可能破坏其非回归的改动都要重点质疑。

4. 诚实性：ARM64 上尚未实现的特性，必须从 `test_init` 返回 `EXIT_SKIP`，
   并在跳过前用 `log_skip` 记录理由，理由格式须为
   "to be implemented (placeholder): <缺失内容>"。
   严禁「假通过」：一个什么都不做的 no-op 测试却报告 pass 属于 bug，必须指出。
   禁止用 EXIT_SUCCESS 伪装未实现项。

5. 架构相关缺陷：重点排查 SVE / NEON 向量长度（VL）相关的越界或误报问题。
   注意 CI runner 的 VL=128 会掩盖 512-bit VL 才暴露的缺陷——
   涉及 VL 的代码是否存在仅在更大 VL 下才越界/误判的隐患？
   若测试依赖 host VL 与编译期 VL 的一致性，请确认其正确性。

6. 失败现场：失败路径是否保留足够的现场信息用于定位 SDC？
   是否保留了冷路径的 bit dump / sum-bit / failing-vector 记录，
   以便在报错时能还原出错的具体向量与比特位？

降噪约束（必须遵守）：
请聚焦于 SDC 激发能力、功能正确性与架构守卫。
不要输出纯粹的代码风格、命名、缩进、格式排版等与上述要点无关的意见，
避免产生噪音。若某处不涉及上述要点，直接略过即可。
"""
