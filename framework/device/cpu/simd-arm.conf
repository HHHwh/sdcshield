# -*- mode: conf; indent-tabs-mode: t -*-
#
# ARM64 / AArch64 CPU feature configuration.
#
# Unlike x86's CPUID leaves, AArch64 exposes per-CPU capability bits through
# the AT_HWCAP / AT_HWCAP2 auxval (see <asm/hwcap.h>), which the framework
# reads at runtime via getauxval().
#
# Column layout:
#   <feature>  <source>  <bit>  [required-feature]
#
#   <source>   = HWCAP  -> bit in AT_HWCAP  (bits 0..31)
#              = HWCAP2 -> bit in AT_HWCAP2 (bits 0..44)
#   <bit>      = the bit number within that HWCAP word
#
# Lines starting with '#' are comments. The first mandatory features are
# always present on an AArch64 baseline (ARMv8.0: FP + ASIMD).

# --- AT_HWCAP (bits 0..31) ---
fp			HWCAP		0		# Floating-point
asimd			HWCAP		1		# Advanced SIMD (NEON)
evtstrm			HWCAP		2		# Generic event timer
aes			HWCAP		3		# AES instructions
pmull			HWCAP		4		# Polynomial Multiply (PMULL)
sha1			HWCAP		5		# SHA-1 instructions
sha2			HWCAP		6		# SHA-2 (SHA256) instructions
crc32			HWCAP		7		# CRC32 instructions
atomics			HWCAP		8		# Large System Extensions (LSE) atomics
fphp			HWCAP		9		# FP16 (half-precision) on FP
asimdhp			HWCAP		10		# FP16 on Advanced SIMD
cpuid			HWCAP		11		# CPUID register access
asimdrdm		HWCAP		12		# RDM (rounding double multiply)
jscvt			HWCAP		13		# FJCVTZS (JS convert)
fcma			HWCAP		14		# Fused multiply-accumulate complex
lrcpc			HWCAP		15		# Load-Acquire RCpc
dcpop			HWCAP		16		# DC CVAP (data cache clean to point of persistence)
sha3			HWCAP		17		# SHA-3 instructions
sm3			HWCAP		18		# SM3 instructions
sm4			HWCAP		19		# SM4 instructions
asimddp			HWCAP		20		# Dot product (UDOT/SDOT)
sha512			HWCAP		21		# SHA-512 instructions
sve			HWCAP		22		# Scalable Vector Extension
asimdfhm		HWCAP		23		# FHNM (FP16 fused multiply-accumulate)
dit			HWCAP		24		# Data Independent Timing
uscat			HWCAP		25		# Unaligned single-copy atomic store
ilrcpc			HWCAP		26		# Load-Acquire RCpc (improved)
flagm			HWCAP		27		# Flag manipulation instructions
ssbs			HWCAP		28		# Speculative Store Bypass Safe
sb			HWCAP		29		# Speculation barrier
paca			HWCAP		30		# Pointer authentication (address)
pacg			HWCAP		31		# Pointer authentication (generic)

# --- AT_HWCAP2 (bits 0..44) ---
dcpodp			HWCAP2		0		# DC CVADP (cache clean to point of deep persistence)
sve2			HWCAP2		1	sve	# SVE2
sveaes			HWCAP2		2	sve2	# SVE2 AES
svepmull		HWCAP2		3	sve2	# SVE2 PMULL
svebitperm		HWCAP2		4	sve2	# SVE2 bit permutation
svesha3			HWCAP2		5	sve2	# SVE2 SHA-3
svesm4			HWCAP2		6	sve2	# SVE2 SM4
flagm2			HWCAP2		7		# Flag manipulation v2
frint			HWCAP2		8		# Frint (round to integral)
svei8mm			HWCAP2		9	sve	# SVE Int8 matrix multiplication
svef32mm		HWCAP2		10	sve	# SVE F32 matrix multiplication
svef64mm		HWCAP2		11	sve	# SVE F64 matrix multiplication
svebf16			HWCAP2		12	sve	# SVE BFloat16
i8mm			HWCAP2		13		# Int8 matrix multiplication (Advanced SIMD)
bf16			HWCAP2		14		# BFloat16 (Advanced SIMD)
dgh			HWCAP2		15		# Data gathering hint
rng			HWCAP2		16		# Random number generator
bti			HWCAP2		17		# Branch Target Identification
mte			HWCAP2		18		# Memory Tagging Extension
ecv			HWCAP2		19		# Enhanced Counter Virtualization
afp			HWCAP2		20		# Alternate Floating-point behavior
rpres			HWCAP2		21		# Reduced-precision reciprocal instructions
mte3			HWCAP2		22		# Memory Tagging Extension v3
sme			HWCAP2		23		# Scalable Matrix Extension
sme_i16i64		HWCAP2		24	sme	# SME int16->int64
sme_f64f64		HWCAP2		25	sme	# SME fp64->fp64
sme_i8i32		HWCAP2		26	sme	# SME int8->int32
sme_f16f32		HWCAP2		27	sme	# SME fp16->fp32
sme_b16f32		HWCAP2		28	sme	# SME bf16->fp32
sme_f32f32		HWCAP2		29	sme	# SME fp32->fp32
sme_fa64		HWCAP2		30	sme	# SME full A64
wfxt			HWCAP2		31		# WFXT (wait-for-event with timeout)
ebf16			HWCAP2		32		# Enhanced BFloat16
sve_ebf16		HWCAP2		33	sve	# SVE Enhanced BFloat16
cssc			HWCAP2		34		# Common Short Sequence Compression
rprfm			HWCAP2		35		# Reduced-precision prefetch
sve2p1			HWCAP2		36	sve	# SVE2.1
sme2			HWCAP2		37	sme	# SME2
sme2p1			HWCAP2		38	sme	# SME2.1
sme_i16i32		HWCAP2		39	sme	# SME int16->int32
sme_bi32i32		HWCAP2		40	sme	# SME bfloat int32
sme_b16b16		HWCAP2		41	sme	# SME BFloat16->BFloat16
sme_f16f16		HWCAP2		42	sme	# SME fp16->fp16
mops			HWCAP2		43		# Memory operations
hbc			HWCAP2		44		# Header Branch Compression

# Synthetic feature (no standard AArch64 HWCAP bit): always unset on real
# hardware. Framework code (virt.cpp, logging_cpu.cpp) gates hypervisor/KVM
# detection on this flag, mirroring x86's CPUID.01H:ECX[31].
hypervisor		NONE		0

# Processor/architecture listing below this line.
# Mirrors x86's arch= inheritance: arch=<name> <base> <new-features>
# Base architecture "<>" is the ARMv8.0 baseline (fp + asimd, mandatory).

arch=aarch64	<>		# ARMv8.0 baseline (FP, ASIMD always present)
arch=v8_1		aarch64	atomics		# ARMv8.1 (LSE)
arch=v8_2		v8_1	dcpop		# ARMv8.2 (DC CVAP)
arch=v8_3		v8_2	fcma,jscvt,lrcpc		# ARMv8.3 (FCMA, JSCVT, LRCPC, PACA, PACG)
arch=v8_4		v8_3	dit,flagm,asimddp,sha3,sm3,sm4,sha512		# ARMv8.4 (DIT, SHA3/SM3/SM4/SHA512, DOTPROD)
arch=v8_5		v8_4	ssbs,asimdfhm,dcpodp		# ARMv8.5 (SSBS, ASIMDFHM)
arch=v8_6		v8_5	bf16,i8mm,rng,bti		# ARMv8.6 (BF16, I8MM)
arch=v8_7		v8_6	wfxt		# ARMv8.7 (WFxT)
arch=v8_8		v8_7	mops,hbc,sve2p1,ecv,afp,rpres		# ARMv8.8 (MOPS, HBC)
# Vendor/known implementations
arch=kunpeng920		v8_2	aes,sha1,sha2,crc32,atomics,fphp,asimdhp,cpuid,asimdrdm,jscvt,fcma,dcpop,asimddp,asimdfhm,ssbs		# Hisilicon Kunpeng 920 (ARMv8.2 + crypto + FP16)
arch=cortex_a76		v8_2	aes,sha1,sha2,crc32,atomics,fphp,asimdhp,cpuid,asimdrdm,jscvt,fcma,dcpop		# Cortex-A76
arch=cortex_a76ae	cortex_a76	# Cortex-A76AE
arch=cortex_a77		cortex_a76	asimddp,sha512,ssbs		# Cortex-A77
arch=cortex_a78		cortex_a77		# Cortex-A78
arch=cortex_a78ae	cortex_a78		# Cortex-A78AE
arch=cortex_a78c	cortex_a78		# Cortex-A78C
arch=cortex_a710	v8_5	ssbs,sb,asimdfhm,flagm,asimddp		# Cortex-A710
arch=cortex_x2		cortex_a710		# Cortex-X2
arch=neoverse_n1	cortex_a76		# Neoverse N1
arch=neoverse_e1	neoverse_n1		# Neoverse E1
arch=neoverse_v1	neoverse_n1	sve,bf16,i8mm,asimddp		# Neoverse V1 (Zeus, SVE)
arch=neoverse_n2	neoverse_v1	sve2,ssbs,sb,asimdfhm,flagm,bf16		# Neoverse N2 (Perseus, SVE2)
arch=neoverse_e2	neoverse_n2		# Neoverse E2
arch=cortex_x3		cortex_a710		# Cortex-X3
arch=cortex_a715	cortex_a710		# Cortex-A715
arch=cortex_x4		cortex_x3		# Cortex-X4
arch=neoverse_v2	neoverse_n2	sve2p1			# Neoverse V2 (Demeter; no SME — SME starts at Neoverse V3)
arch=neoverse_n3	neoverse_v2		# Neoverse N3 (Perseus N3)
arch=cortex_a720	cortex_a715		# Cortex-A720
arch=cortex_x3b		cortex_x3		# Cortex-X3C
# A-profile application cores
arch=firestorm		cortex_a76		# Apple M1 Firestorm-equivalent (approx)
